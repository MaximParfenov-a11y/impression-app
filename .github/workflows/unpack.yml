name: Unpack impression-app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Unpack
        if: steps.find_zip.outputs.zip != ''
        run: |
          mkdir -p /tmp/project
          unzip -q "${{ steps.find_zip.outputs.zip }}" -d /tmp/project

          ROOT="/tmp/project"

          if [ -d "/tmp/project/impression-app" ]; then
            ROOT="/tmp/project/impression-app"
          fi

          cp -R "$ROOT"/. ./

          rm -f "${{ steps.find_zip.outputs.zip }}"

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Unpack impression app"
            git push
          fi
